<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rangla — Cart (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3FD9}a:hover{color:#3F27A8}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: #FFFFFF; color: #1C1A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">

<header style="padding: 10px 8px 10px 8px; display: flex; align-items: center; gap: 6px">
<a href="ProductMobile.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C1A2E">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
<h1 style="margin: 0; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Cart</h1>
<span style="font-size: 12px; color: #5F5B73">{{countLabel}}</span>
</div>
<button type="button" aria-label="More options" style="width: 44px; height: 44px; border: none; background: transparent; color: #1C1A2E; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
</button>
</header>

<main style="flex: 1; display: flex; flex-direction: column; padding: 4px 16px 24px">
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<article style="display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid #EEEAF6">
<a href="{{it.href}}" aria-label="View {{it.name}}" style="flex: none; width: 96px; height: 96px; border-radius: 16px; background: {{it.tint}}; display: flex; align-items: center; justify-content: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1C1A2E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 6px">
<h2 style="margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3"><a href="{{it.href}}" style="color: #1C1A2E; text-decoration: none">{{it.name}}</a></h2>
<button type="button" aria-label="Remove {{it.name}}" onClick="{{it.remove}}" style="flex: none; width: 36px; height: 36px; margin: -8px -8px 0 0; border: none; background: transparent; color: #6E6A82; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<span style="font-size: 12px; color: #5F5B73">{{it.variant}}</span>
<span style="font-weight: 800; font-size: 15px; color: #5B3FD9">Rs. {{it.priceText}}</span>
<div style="display: flex; align-items: center; height: 36px; margin-top: 4px; align-self: flex-start; border-radius: 10px; background: #F4F1FD">
<button type="button" aria-label="Decrease quantity of {{it.name}}" onClick="{{it.dec}}" style="width: 40px; height: 40px; border: none; background: transparent; color: #1C1A2E; font: inherit; font-size: 17px; font-weight: 700">−</button>
<span aria-label="Quantity {{it.qty}}" style="min-width: 20px; text-align: center; font-weight: 700; font-size: 14px">{{it.qty}}</span>
<button type="button" aria-label="Increase quantity of {{it.name}}" onClick="{{it.inc}}" style="width: 40px; height: 40px; border: none; background: transparent; color: #1C1A2E; font: inherit; font-size: 17px; font-weight: 700">+</button>
</div>
</div>
</article>
</sc-for>
</div>
<dl style="margin: 16px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px">
<dt style="color: #5F5B73">Subtotal</dt><dd style="margin: 0; font-weight: 600">Rs. {{subtotal}}</dd>
<dt style="color: #5F5B73">You save</dt><dd style="margin: 0; font-weight: 600; color: #157544">− Rs. {{savings}}</dd>
<dt style="color: #5F5B73">Delivery</dt><dd style="margin: 0; font-weight: 600">{{delivery}}</dd>
</dl>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 12px; text-align: center">
<span style="width: 104px; height: 104px; border-radius: 999px; background: #EFEBFF; display: flex; align-items: center; justify-content: center">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5B3FD9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.5 12h11.5l2-8H6.2"></path></svg>
</span>
<h2 style="margin: 0; font-weight: 800; font-size: 20px">Your cart is empty</h2>
<p style="margin: 0; font-size: 14px; color: #5F5B73">Browse categories and add something you love.</p>
<a href="CategoriesMobile.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 12px; background: #5B3FD9; color: #FFFFFF; text-decoration: none; font-weight: 700">Browse categories</a>
<button type="button" onClick="{{restore}}" style="min-height: 44px; padding: 0 16px; border: none; background: transparent; color: #5B3FD9; font: inherit; font-weight: 600">Restore items</button>
</section>
</sc-if>
</main>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<div style="position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 20px; background: #FFFFFF; border-top: 1px solid #EEEAF6; box-shadow: 0 -6px 20px rgba(40, 24, 120, 0.06)">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 14px; color: #5F5B73; font-weight: 600">Total</span>
<span style="font-weight: 800; font-size: 22px">Rs. {{total}}</span>
</div>
<a href="CheckoutMobile.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #5B3FD9; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Checkout</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qty: { 1: 1, 2: 1, 3: 1 }, removed: {} };
  }
  renderVals() {
    const I = {
      dress: 'M9 2h6l-1 5 5 15H5l5-15z',
      headphones: 'M4 15v-3a8 8 0 0 1 16 0v3M4 15h3v5H5a1 1 0 0 1-1-1zM20 15h-3v5h2a1 1 0 0 0 1-1z',
      shoe: 'M3 17V9l4 1 3-3 2 4c3 1 7 2 9 4v2zM3 17h18v3H3z'
    };
    const catalogue = [
      { id: 1, name: "Women's Printed Lawn 3-Piece", variant: 'Lilac · Unstitched', price: 4250, was: 5950, icon: I.dress, tint: '#EDE7FF', href: 'ProductMobile.dc.html' },
      { id: 2, name: 'Noise Cancelling Headphones', variant: 'Black', price: 8999, was: 14999, icon: I.headphones, tint: '#F4F1FD', href: '#' },
      { id: 3, name: 'Handcrafted Leather Khussa', variant: 'Gold · Size 7', price: 2499, was: 3299, icon: I.shoe, tint: '#FFF7EE', href: '#' }
    ];
    const st = this.state;
    const fmt = (n) => n.toLocaleString('en-US');
    const items = catalogue.filter((c) => !st.removed[c.id]).map((c) => {
      const q = st.qty[c.id];
      return {
        ...c,
        qty: q,
        priceText: fmt(c.price),
        dec: () => this.setState({ qty: { ...this.state.qty, [c.id]: Math.max(1, q - 1) } }),
        inc: () => this.setState({ qty: { ...this.state.qty, [c.id]: Math.min(10, q + 1) } }),
        remove: () => this.setState({ removed: { ...this.state.removed, [c.id]: true } })
      };
    });
    const count = items.reduce((s, i) => s + i.qty, 0);
    const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
    const savings = items.reduce((s, i) => s + (i.was - i.price) * i.qty, 0);
    const fee = subtotal >= 3000 || subtotal === 0 ? 0 : 200;
    return {
      items,
      countLabel: count === 1 ? '1 item' : count + ' items',
      hasItems: items.length > 0,
      isEmpty: items.length === 0,
      subtotal: fmt(subtotal),
      savings: fmt(savings),
      delivery: fee === 0 ? 'Free' : 'Rs. ' + fmt(fee),
      total: fmt(subtotal + fee),
      restore: () => this.setState({ removed: {}, qty: { 1: 1, 2: 1, 3: 1 } })
    };
  }
}
</script>
</body>
</html>
