name: M108 test-site photo rollout

# M108 (ADR-049 item 6): runs scripts/rollout-demo-photos.ts against the TEST environment only
# (Neon `gocart-test` + Vercel Blob `gocart-test-media`, ADR-046). Never production.
#
# Why a workflow: the credentials live only in GitHub encrypted secrets of the `gocart-test`
# environment, so nobody pastes them into a chat, a terminal or a file, GitHub masks them in logs,
# and the runner reaches Neon and the Blob API. Started by hand only (no push, PR or schedule
# trigger), only from `main`, one run at a time. Dry run unless `mode` is `apply`.
#
# Required environment secrets (Settings -> Environments -> gocart-test):
#   TEST_DATABASE_URI           Neon pooled connection string for the restricted gocart_app role
#   TEST_BLOB_READ_WRITE_TOKEN  read-write token of the gocart-test-media Blob store
# Remove both after the rollout. Never put a production value here.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run writes nothing; apply uploads and relinks'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      db_host:
        description: 'Exact Neon host of TEST_DATABASE_URI (the tool refuses a mismatch)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: m108-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gocart-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The 24 licence-checked originals, each kept only if it matches the manifest's original_sha256.
      - run: npm run fetch:demo-originals
      # Rebuild the 61 processed files; they must come out byte-identical to the manifest.
      - run: npm run process:demo-images
      - run: npm run process:demo-images -- --check
      - name: Processed files match the committed manifest
        run: git diff --exit-code -- docs/assets/MANIFEST.csv
      - name: Rollout (${{ inputs.mode }})
        env:
          DATABASE_URI: ${{ secrets.TEST_DATABASE_URI }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.TEST_BLOB_READ_WRITE_TOKEN }}
          DEMO_ROLLOUT_DB_HOST: ${{ inputs.db_host }}
          MODE: ${{ inputs.mode }}
        run: |
          # A throwaway secret for this process only: the rollout signs no session or API key.
          PAYLOAD_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PAYLOAD_SECRET"
          export PAYLOAD_SECRET
          if [ "$MODE" = "apply" ]; then
            npx tsx scripts/rollout-demo-photos.ts --env test --apply
          else
            npx tsx scripts/rollout-demo-photos.ts --env test
          fi
      # After an apply: the manifest with media_id / media_env=test and the rollback log, for the PR
      # that records them. No secret is in either file.
      - if: inputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: m108-rollout-${{ github.run_id }}
          path: |
            docs/assets/MANIFEST.csv
            demo-assets/_processed/rollout-test-*.jsonl
          if-no-files-found: warn
          retention-days: 30
